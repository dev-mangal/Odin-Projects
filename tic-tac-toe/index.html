<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game">
        <h1>Tic-Tac-Toe</h1>

        <form class="player-form">
            <div class="player-input">
                <label for="player1">Player X</label>
                <input
                    type="text"
                    id="player1"
                    placeholder="Enter player X's name"
                    required
                >
            </div>

            <div class="player-input">
                <label for="player2">Player O</label>
                <input
                    type="text"
                    id="player2"
                    placeholder="Enter player O's name"
                    required
                >
            </div>

            <button type="submit" id="start-button">
                Start Game
            </button>
        </form>

        <p id="game-status" aria-live="polite">
            Enter both names to start playing.
        </p>

        <div class="gameboard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </main>
</body>
</html>
